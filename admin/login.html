<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JastipMayza</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Admin Specific CSS -->
    <link rel="stylesheet" href="../assets/admin/css/login.css">
    <link rel="stylesheet" href="../assets/admin/css/responsive.css">
</head>
<body class="login-body">

    <!-- Loading Overlay -->
    <div id="loading-spinner" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2><img src="../img/mayza 1.png" alt="JastipMayza" style="height:36px;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto;"> Jastip<span>Mayza</span></h2>
                <p>Silakan login untuk mengakses Panel Admin</p>
            </div>
            
            <!-- Form Error Message Placeholder -->
            <div id="login-error" class="alert alert-danger" style="display: none;"></div>

            <form id="admin-login-form" class="form-group" autocomplete="on">
                <div class="input-group">
                    <label for="username">Email Admin</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="username" name="username"
                               placeholder="Masukkan email admin"
                               autocomplete="email" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password"
                               placeholder="Masukkan password"
                               autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="btn-toggle-pass" tabindex="-1">
                            <i class="fa-solid fa-eye" id="toggle-pass-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    Login <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="reset-password.html"><i class="fa-solid fa-key"></i> Lupa Password?</a>
                <span style="color:#d1d5db;margin:0 8px;">|</span>
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Website</a>
            </div>
        </div>
    </div>

    <!-- Login JS -->
    <script src="../assets/admin/js/login.js" type="module"></script>
</body>
</html>
