<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JastipMayla</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Admin Specific CSS -->
    <link rel="stylesheet" href="../assets/admin/css/login.css">
    <link rel="stylesheet" href="../assets/admin/css/responsive.css">
</head>
<body class="login-body">

    <!-- Loading Overlay -->
    <div id="loading-spinner" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2><i class="fa-solid fa-bag-shopping"></i> Jastip<span>Mayla</span></h2>
                <p>Silakan login untuk mengakses Panel Admin</p>
            </div>
            
            <!-- Form Error Message Placeholder -->
            <div id="login-error" class="alert alert-danger" style="display: none;"></div>

            <form id="admin-login-form" class="form-group">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="off">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    Login <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Website</a>
            </div>
        </div>
    </div>

    <!-- Modular JS -->
    <script src="../assets/admin/js/api.js" type="module"></script>
    <script src="../assets/admin/js/login.js" type="module"></script>
</body>
</html>
