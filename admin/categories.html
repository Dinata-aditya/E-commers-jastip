<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kategori - JastipMayza Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <link rel="stylesheet" href="../assets/admin/css/sidebar.css">
    <link rel="stylesheet" href="../assets/admin/css/table.css">
    <link rel="stylesheet" href="../assets/admin/css/category.css">
    <link rel="stylesheet" href="../assets/admin/css/modal.css">
    <link rel="stylesheet" href="../assets/admin/css/form.css">
    <link rel="stylesheet" href="../assets/admin/css/responsive.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <h2><img src="../img/mayza 1.png" alt="logo" style="height:28px;margin-right:8px;"> AdminPanel</h2>
                <button class="close-sidebar" id="close-sidebar-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-title">Menu Utama</li>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li class="menu-title">Kelola Data</li>
                <li><a href="products.html"><i class="fa-solid fa-box"></i> Produk</a></li>
                <li><a href="categories.html" class="active"><i class="fa-solid fa-tags"></i> Kategori</a></li>
                <li class="menu-title">Pengaturan</li>
                <li><a href="profile.html"><i class="fa-solid fa-user-gear"></i> Profil Admin</a></li>
                <li><a href="#" id="btn-logout" class="text-danger"><i class="fa-solid fa-power-off"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="toggle-sidebar-btn" class="btn-icon"><i class="fa-solid fa-bars"></i></button>
                    <h3>Daftar Kategori</h3>
                </div>
                <div class="topbar-right">
                    <div class="profile-dropdown-wrapper">
                        <button class="profile-trigger" id="profile-trigger">
                            <img id="profile-avatar" src="https://ui-avatars.com/api/?name=Admin&background=4F46E5&color=fff" alt="Avatar" class="avatar">
                            <div class="profile-info">
                                <span class="profile-name" id="profile-name">Admin</span>
                                <span class="profile-role" id="profile-email">Administrator</span>
                            </div>
                            <i class="fa-solid fa-chevron-down profile-chevron"></i>
                        </button>
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="dropdown-header">
                                <div class="d-name" id="dropdown-name">Admin</div>
                                <div class="d-email" id="dropdown-email">admin@jastipmayza.com</div>
                            </div>
                            <a href="../index.html" target="_blank" class="dropdown-item">
                                <i class="fa-solid fa-globe"></i> Lihat Website
                            </a>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item danger" id="btn-logout-dropdown">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-body">
            <div class="category-layout">
                <!-- Form Tambah Kategori di sebelah kiri -->
                <div class="form-card">
                    <h4>Tambah Kategori Baru</h4>
                    <form id="add-category-form" style="margin-top: 20px;">
                        <input type="hidden" id="category_id_input">
                        <div class="input-group">
                            <label for="category_name">Nama Kategori</label>
                            <input type="text" id="category_name" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Simpan Kategori</button>
                    </form>
                </div>

                <!-- Tabel Kategori di sebelah kanan -->
                <div class="table-responsive" style="background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Kategori</th>
                                <th>Total Produk</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="category-table-body">
                            <!-- Dimuat oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div><!-- /.category-layout -->
            </div><!-- /.content-body -->
        </main>
    </div>

    <!-- Modal Hapus (Sama seperti di products.html) -->
    
    <script src="../assets/admin/js/dashboard.js"></script>
    <script src="../assets/admin/js/api.js" type="module"></script>
    <script src="../assets/admin/js/crud-category.js" type="module"></script>

    <!-- Admin Bottom Nav (mobile) -->
    <nav class="admin-bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="products.html">
            <i class="fa-solid fa-box"></i>
            <span>Produk</span>
        </a>
        <a href="add-product.html">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Tambah</span>
        </a>
        <a href="categories.html" class="active">
            <i class="fa-solid fa-tags"></i>
            <span>Kategori</span>
        </a>
        <a href="profile.html">
            <i class="fa-solid fa-user-gear"></i>
            <span>Profil</span>
        </a>
    </nav>
</body>
</html>
