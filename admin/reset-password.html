<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JastipMayza</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Reuse login CSS -->
    <link rel="stylesheet" href="../assets/admin/css/login.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2><i class="fa-solid fa-bag-shopping"></i> Jastip<span>Mayza</span></h2>
                <p>Buat password baru untuk akun admin kamu</p>
            </div>

            <!-- Pesan error / sukses -->
            <div id="reset-error"   class="alert alert-danger"  style="display:none;"></div>
            <div id="reset-success" class="alert alert-success" style="display:none;"></div>

            <form id="reset-password-form" class="form-group">
                <div class="input-group">
                    <label for="new-password">Password Baru</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="new-password"
                               placeholder="Minimal 6 karakter" required>
                        <button type="button" id="toggle-new-pass" class="btn-toggle-pass" tabindex="-1">
                            <i class="fa-solid fa-eye" id="toggle-new-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm-password"
                               placeholder="Ulangi password baru" required>
                        <button type="button" id="toggle-confirm-pass" class="btn-toggle-pass" tabindex="-1">
                            <i class="fa-solid fa-eye" id="toggle-confirm-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                    Simpan Password <i class="fa-solid fa-check"></i>
                </button>
            </form>

            <div class="login-footer">
                <a href="login.html?key=jastipmayza2026"><i class="fa-solid fa-arrow-left"></i> Kembali ke Login</a>
            </div>
        </div>
    </div>

    <style>
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #86efac;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>

    <script src="../assets/admin/js/reset-password.js" type="module"></script>
</body>
</html>
